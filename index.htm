<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EIC AURA - Real-Time Sonic Earth</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00f3ff;--magenta:#ff00ea;--dark:#03070d;--panel:rgba(8,15,25,.85);--border:rgba(0,243,255,.3)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:radial-gradient(circle at 50% 50%,#0a1c30 0%,#03070d 100%);color:#fff;font-family:'Share Tech Mono',monospace;height:100vh;overflow:hidden}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
#start-screen{position:fixed;inset:0;background:var(--dark);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .8s}
h1{font-family:Orbitron,sans-serif;font-size:clamp(2.2rem,8vw,4rem);letter-spacing:8px;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.subtitle{color:#8a9bb0;letter-spacing:4px;margin-bottom:20px}
.hint{color:#8a9bb0;max-width:520px;line-height:1.6;margin-bottom:35px;font-size:.95rem}
#start-btn{padding:18px 60px;font:1.4rem Orbitron,sans-serif;background:rgba(0,243,255,.1);color:var(--cyan);border:2px solid var(--cyan);cursor:pointer;transition:.3s}
#start-btn:hover,#start-btn:focus-visible{background:var(--cyan);color:var(--dark);box-shadow:0 0 40px var(--cyan)}
.app{display:none;width:100%;height:100%;grid-template-columns:270px 1fr 320px;gap:15px;padding:15px}
.sidebar,.tele{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(10px);overflow:auto}
.title{font-family:Orbitron,sans-serif;color:var(--cyan);font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:8px;letter-spacing:2px}
.layer-btn,.mode-btn{padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid #334455;color:#9fb0c2;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.layer-btn:hover,.mode-btn:hover{border-color:#9fb0c2;color:#fff}
.layer-btn.active{background:rgba(0,243,255,.1);border-color:var(--cyan);color:var(--cyan)}
.mode-btn.active{border-color:var(--magenta);color:var(--magenta);background:rgba(255,0,234,.1)}
label{font-size:.8rem;color:#9fb0c2;display:flex;flex-direction:column;gap:5px}
input[type=date]{background:#0a1522;color:#fff;border:1px solid #334455;padding:8px;font:inherit;color-scheme:dark}
input[type=range]{accent-color:var(--cyan)}
select,input[type=search]{background:#0a1522;color:#fff;border:1px solid #334455;padding:8px;font:inherit;color-scheme:dark;min-width:0}
#sform{display:flex;gap:6px}#sform input{flex:1}
#start-screen select{margin-bottom:18px}
.status{margin-top:auto;font-size:.78rem;color:#8a9bb0;line-height:1.7}
.map-area{position:relative;background:#000;border:1px solid var(--border);border-radius:8px;overflow:hidden;touch-action:none;min-height:260px}
canvas#map{width:100%;height:100%;display:block;cursor:crosshair}
canvas#lbl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lx,.ly,.scan{position:absolute;pointer-events:none;display:none}
.lx{width:1px;height:100%;top:0;left:0;background:var(--cyan);box-shadow:0 0 12px 3px var(--cyan);opacity:.7}
.ly{height:1px;width:100%;left:0;top:0;background:var(--cyan);box-shadow:0 0 12px 3px var(--cyan);opacity:.7}
.scan{width:2px;height:100%;top:0;left:0;background:var(--magenta);box-shadow:0 0 20px 5px var(--magenta)}
canvas#wave{width:100%;height:90px;background:rgba(0,0,0,.6);border-radius:5px;border:1px solid #1a2a3a}
.box{background:rgba(0,0,0,.4);padding:11px;border-left:3px solid var(--cyan);font-size:.88rem;line-height:1.7}
.box.m{border-color:var(--magenta)}
.box span{color:var(--cyan);float:right;font-weight:700}
.modes{display:flex;gap:8px}.modes .mode-btn{flex:1;justify-content:center}
.legend{font-size:.75rem;color:#9fb0c2;line-height:1.6}
@media(max-width:900px){body{height:auto;overflow:auto}.app{grid-template-columns:1fr;height:auto}.map-area{height:55vh}}
</style>
</head>
<body>
<div id="start-screen">
  <h1>EIC AURA</h1>
  <div class="subtitle">REAL-TIME SONIC EARTH ENGINE</div>
  <select class="langsel" aria-label="Language"></select>
  <p class="hint" data-i="hint"></p>
  <button id="start-btn" data-i="start"></button>
</div>

<main class="app" id="app">
  <nav class="sidebar" aria-label="Controls">
    <div class="title" data-i="layers"></div>
    <div id="layers" style="display:flex;flex-direction:column;gap:8px"></div>
    <label><span data-i="date"></span><input type="date" id="date"></label>
    <label><span data-i="vol"></span><input type="range" id="vol" min="0" max="100" value="80"></label>
    <label><span data-i="speed"></span><input type="range" id="speed" min="1" max="12" value="4"></label>
    <label><span data-i="inst"></span><select id="inst"><option value="sine">Sine</option><option value="triangle">Triangle</option><option value="sawtooth">Saw</option><option value="square">Square</option></select></label>
    <label><span data-i="scale"></span><select id="scale"><option value="pent">Pentatonic</option><option value="major">Major</option><option value="hijaz">Hijaz (maqam)</option></select></label>
    <button class="mode-btn" id="speech"></button>
    <button class="mode-btn" id="labels"></button>
    <button class="mode-btn" id="rec"></button>
    <select class="langsel" aria-label="Language"></select>
    <div class="status"><p id="src">> SOURCE: --</p><p>> DATA: NASA GIBS / EIC</p></div>
  </nav>

  <div class="map-area" id="area" tabindex="0" role="application" aria-label="Sonic Earth map. Arrow keys move the probe, Space toggles auto-scan, 1-5 switch layers.">
    <canvas id="map"></canvas><canvas id="lbl" aria-hidden="true"></canvas>
    <div class="lx" id="lx"></div><div class="ly" id="ly"></div><div class="scan" id="scan"></div>
  </div>

  <aside class="tele" aria-label="Audio telemetry">
    <form id="sform"><input type="search" id="q"><button class="mode-btn" data-i="go"></button></form>
    <div class="title">AUDIO TELEMETRY</div>
    <canvas id="wave" aria-hidden="true"></canvas>
    <div class="box">
      <div>PIXEL RGB: <span id="v-rgb">---</span></div>
      <div>LAT / LON: <span id="v-pos">---</span></div>
      <div><span data-i="cls"></span>: <span id="v-class" style="color:#fff">---</span></div>
    </div>
    <div class="box"><div data-i="place"></div><div id="v-place" style="color:var(--cyan);font-weight:700;margin-top:4px">---</div></div>
    <div class="box m">
      <div>MELODY (Hz): <span id="v-mel">---</span></div>
      <div>BASS (Hz): <span id="v-bass">---</span></div>
      <div>FILTER (Hz): <span id="v-flt">---</span></div>
    </div>
    <div class="legend" data-i="legend"></div>
    <div class="title" data-i="mode"></div>
    <div class="modes">
      <button class="mode-btn active" id="b-manual" data-i="manual"></button>
      <button class="mode-btn" id="b-auto" data-i="auto"></button>
    </div>
  </aside>
</main>

<script>
const $=id=>document.getElementById(id);
const cv=$('map'),ctx=cv.getContext('2d',{willReadFrequently:true});
const wv=$('wave'),wctx=wv.getContext('2d'),area=$('area');
const lbl=$('lbl'),lctx=lbl.getContext('2d');
const lx=$('lx'),ly=$('ly'),scan=$('scan');
let rec,chunks=[],showLbl=true,lang='en',lblImg=null,curPlace='',cur={c:'',lat:0,lon:0},A={},mode='manual',cx=0,cy=0,scanX=0,key='true',img=new Image(),offline=false,speech=false,lastSay='',lastT=0,started=false;

// Minor pentatonic over 3 octaves (always harmonious)
const SC={pent:[0,3,5,7,10],major:[0,2,4,5,7,9,11],hijaz:[0,1,4,5,7,8,10]};let notes=[];
function buildNotes(){notes=[];[.5,1,2].forEach(o=>SC[$('scale').value].forEach(n=>notes.push(261.63*2**(n/12)*o)))}
$('scale').onchange=buildNotes;$('inst').onchange=()=>A.mel&&(A.mel.o.type=$('inst').value);

// UI languages (add a new block here to add a language)
const T={
en:{hint:'Explore live NASA Earth imagery by sound. Move the mouse or finger over the map, or use the arrow keys (Shift = bigger steps, Space = auto-scan, 1-5 = layers). Headphones recommended.',start:'INITIALIZE SYSTEM',layers:'NASA EIC DATA LAYERS',date:'IMAGE DATE (daily layers)',vol:'VOLUME',speed:'AUTO-SCAN SPEED',inst:'INSTRUMENT',scale:'MUSICAL SCALE',voice:'VOICE DESCRIPTION',labels:'PLACE LABELS',rec:'RECORD SOUND',place:'PLACE',cls:'CLASS',legend:'Pitch = color / data value<br>Bass = blue (water)<br>Brightness = saturation<br>Left-right pan = longitude<br>Low-high drone = latitude<br>Silence = no data',mode:'SCAN MODE',manual:'MANUAL',auto:'AUTO-SCAN',search:'Search a place...',go:'GO',low:'LOW',mid:'MEDIUM',high:'HIGH',ocean:'OCEAN / WATER',land:'LAND / FOREST',ice:'CLOUDS / ICE',desert:'DESERT / BARE LAND',nodata:'NO DATA',water:'Open water / no named place',lat:'Latitude',lon:'longitude',l_true:'TRUE COLOR',l_night:'CITY LIGHTS',l_land:'LAND TEMPERATURE',l_sea:'SEA TEMPERATURE',l_rain:'RAINFALL'},
ar:{hint:'استكشف صور ناسا الحية للأرض بالصوت. حرّك الماوس أو إصبعك فوق الخريطة، أو استخدم الأسهم (Shift = خطوة أكبر، Space = مسح تلقائي، 1-5 = الطبقات). يُفضّل استخدام سماعات.',start:'تشغيل النظام',layers:'طبقات بيانات ناسا EIC',date:'تاريخ الصورة (للطبقات اليومية)',vol:'مستوى الصوت',speed:'سرعة المسح التلقائي',inst:'الآلة',scale:'السلّم الموسيقي',voice:'الوصف الصوتي',labels:'أسماء الأماكن',rec:'تسجيل الصوت',place:'المكان',cls:'التصنيف',legend:'النغمة = اللون / قيمة البيانات<br>الباس = الأزرق (الماء)<br>السطوع = التشبّع<br>اليمين/اليسار = خط الطول<br>الدرون منخفض/عالٍ = خط العرض<br>الصمت = لا توجد بيانات',mode:'وضع المسح',manual:'يدوي',auto:'مسح تلقائي',search:'ابحث عن مكان...',go:'اذهب',low:'منخفض',mid:'متوسط',high:'مرتفع',ocean:'محيط / مياه',land:'يابسة / غابات',ice:'سحب / جليد',desert:'صحراء / أرض جرداء',nodata:'لا توجد بيانات',water:'مياه مفتوحة / لا يوجد مكان مسمّى',lat:'خط العرض',lon:'خط الطول',l_true:'الألوان الحقيقية',l_night:'أضواء المدن',l_land:'حرارة اليابسة',l_sea:'حرارة البحر',l_rain:'الأمطار'},
fr:{hint:'Explorez les images de la Terre de la NASA par le son. Déplacez la souris ou le doigt sur la carte, ou utilisez les flèches (Maj = pas plus grand, Espace = balayage auto, 1-5 = couches). Casque recommandé.',start:'INITIALISER',layers:'COUCHES DE DONNÉES NASA EIC',date:"DATE DE L'IMAGE (couches quotidiennes)",vol:'VOLUME',speed:'VITESSE DU BALAYAGE',inst:'INSTRUMENT',scale:'GAMME MUSICALE',voice:'DESCRIPTION VOCALE',labels:'NOMS DES LIEUX',rec:'ENREGISTRER',place:'LIEU',cls:'CLASSE',legend:'Hauteur = couleur / valeur<br>Basse = bleu (eau)<br>Brillance = saturation<br>Panoramique = longitude<br>Bourdon grave/aigu = latitude<br>Silence = pas de données',mode:'MODE DE BALAYAGE',manual:'MANUEL',auto:'BALAYAGE AUTO',search:'Rechercher un lieu...',go:'OK',low:'FAIBLE',mid:'MOYEN',high:'ÉLEVÉ',ocean:'OCÉAN / EAU',land:'TERRE / FORÊT',ice:'NUAGES / GLACE',desert:'DÉSERT / TERRE NUE',nodata:'PAS DE DONNÉES',water:'Eaux libres / aucun lieu nommé',lat:'Latitude',lon:'longitude',l_true:'COULEURS RÉELLES',l_night:'LUMIÈRES DES VILLES',l_land:'TEMPÉRATURE TERRESTRE',l_sea:'TEMPÉRATURE DE LA MER',l_rain:'PRÉCIPITATIONS'},
es:{hint:'Explora las imágenes de la Tierra de la NASA con sonido. Mueve el ratón o el dedo sobre el mapa, o usa las flechas (Mayús = pasos grandes, Espacio = barrido auto, 1-5 = capas). Se recomiendan auriculares.',start:'INICIAR SISTEMA',layers:'CAPAS DE DATOS NASA EIC',date:'FECHA DE LA IMAGEN (capas diarias)',vol:'VOLUMEN',speed:'VELOCIDAD DE BARRIDO',inst:'INSTRUMENTO',scale:'ESCALA MUSICAL',voice:'DESCRIPCIÓN POR VOZ',labels:'NOMBRES DE LUGARES',rec:'GRABAR SONIDO',place:'LUGAR',cls:'CLASE',legend:'Tono = color / valor<br>Bajo = azul (agua)<br>Brillo = saturación<br>Paneo = longitud<br>Bordón grave/agudo = latitud<br>Silencio = sin datos',mode:'MODO DE BARRIDO',manual:'MANUAL',auto:'BARRIDO AUTO',search:'Buscar un lugar...',go:'IR',low:'BAJO',mid:'MEDIO',high:'ALTO',ocean:'OCÉANO / AGUA',land:'TIERRA / BOSQUE',ice:'NUBES / HIELO',desert:'DESIERTO / SUELO DESNUDO',nodata:'SIN DATOS',water:'Aguas abiertas / sin lugar con nombre',lat:'Latitud',lon:'longitud',l_true:'COLOR REAL',l_night:'LUCES DE CIUDADES',l_land:'TEMPERATURA DE TIERRA',l_sea:'TEMPERATURA DEL MAR',l_rain:'LLUVIA'}};
const tr=k=>T[lang][k]||T.en[k];
function toggles(){
  [['speech',speech,'voice'],['labels',showLbl,'labels']].forEach(([id,on,k])=>{const b=$(id);b.textContent=tr(k)+(on?' ✓':' ✗');b.setAttribute('aria-pressed',on);b.classList.toggle('active',on)});
  const on=rec&&rec.state==='recording';$('rec').textContent=tr('rec')+(on?' ●':'');$('rec').classList.toggle('active',!!on);
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=tr(e.dataset.i));
  document.querySelectorAll('.langsel').forEach(x=>x.value=lang);
  $('q').placeholder=tr('search');curPlace='';toggles();
}

// Real NASA GIBS layers (CORS-enabled WMS)
const L={
 true:{n:'TRUE COLOR',i:'🌍',id:'MODIS_Terra_CorrectedReflectance_TrueColor',day:1,t:'terrain'},
 night:{n:'CITY LIGHTS',i:'🌃',id:'VIIRS_Black_Marble',t:'lum',lab:['DARK AREA','SETTLED AREA','URBAN CORE']},
 land:{n:'LAND TEMPERATURE',i:'🌡️',id:'MODIS_Terra_Land_Surface_Temp_Day',day:1,t:'hue',lab:['COLD','MILD','HOT']},
 sea:{n:'SEA TEMPERATURE',i:'🌊',id:'GHRSST_L4_MUR_Sea_Surface_Temperature',day:1,t:'hue',lab:['COLD WATER','WARM WATER','VERY WARM WATER']},
 rain:{n:'RAINFALL',i:'🌧️',id:'IMERG_Precipitation_Rate',day:1,t:'hue',lab:['LIGHT RAIN','RAIN','HEAVY RAIN']}
};
const url=k=>'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&STYLES=&CRS=EPSG:4326&BBOX=-90,-180,90,180&WIDTH=1440&HEIGHT=720&FORMAT=image/jpeg&LAYERS='+L[k].id+(L[k].day?'&TIME='+$('date').value:'');

Object.keys(L).forEach(k=>{
  const b=document.createElement('button');b.className='layer-btn';b.dataset.k=k;
  b.innerHTML=`<span data-i="l_${k}"></span><span aria-hidden="true">${L[k].i}</span>`;
  b.onclick=()=>load(k);$('layers').appendChild(b);
});
const today=new Date();$('date').max=today.toISOString().slice(0,10);
$('date').value=new Date(Date.now()-3*864e5).toISOString().slice(0,10);
$('date').onchange=()=>load(key);

function load(k){
  key=k;
  document.querySelectorAll('.layer-btn').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
  $('src').textContent='> SOURCE: LOADING...';
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{img=im;offline=false;draw()};
  im.onerror=()=>{offline=true;draw()};
  im.src=url(k);
}
// Place names: NASA GIBS reference overlay (drawn on its own canvas, so it never affects the sound)
function loadLabels(){
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{lblImg=im;drawLabels()};
  im.src='https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&STYLES=&CRS=EPSG:4326&BBOX=-90,-180,90,180&WIDTH=2880&HEIGHT=1440&TRANSPARENT=TRUE&FORMAT=image/png&LAYERS=Reference_Features_15m,Coastlines_15m,Reference_Labels_15m';
}
function drawLabels(){
  lctx.clearRect(0,0,lbl.width,lbl.height);
  if(showLbl&&lblImg)lctx.drawImage(lblImg,0,0,lbl.width,lbl.height);
}
$('labels').onclick=()=>{showLbl=!showLbl;drawLabels();toggles()};
// Live place name under the probe (OpenStreetMap Nominatim, max ~1 request/second)
const gc={};let gBusy=0,gLast=0,gPos=[0,0];
function geoReq(lat,lon){
  gPos=[lat,lon];if(gBusy)return;gBusy=1;
  setTimeout(async()=>{
    gBusy=0;const[la,lo]=gPos,k=lang+la.toFixed(1)+','+lo.toFixed(1);let p=gc[k];
    if(p===undefined){
      gLast=Date.now();
      try{
        const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=8&accept-language=${lang}&lat=${la}&lon=${lo}`)).json();
        p=j.error?tr('water'):j.display_name;gc[k]=p;
      }catch(e){return}
    }
    curPlace=p;$('v-place').textContent=p;say(cur.c,cur.lat,cur.lon);
  },Math.max(300,1100-(Date.now()-gLast)));
}


function demoMap(){ // offline fallback so the instrument always works
  const w=cv.width,h=cv.height,c=8;
  for(let y=0;y<h;y+=c)for(let x=0;x<w;x+=c){
    const u=x/w*6.28,v=y/h*3.14,e=Math.sin(u*2+1)*Math.cos(v*3)+Math.sin(u*5)*Math.sin(v*4)*.5,p=Math.abs(y/h-.5)*2;
    ctx.fillStyle=p>.9?'#eef':e>.35?`rgb(${60+e*60|0},${120+e*40|0},60)`:`rgb(10,${60+e*30|0},${150+e*40|0})`;
    ctx.fillRect(x,y,c,c);
  }
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(!offline&&img.naturalWidth){
    ctx.drawImage(img,0,0,cv.width,cv.height);
    try{ctx.getImageData(0,0,1,1);$('src').textContent='> SOURCE: NASA GIBS (LIVE)';return}catch(e){offline=true}
  }
  demoMap();$('src').textContent='> SOURCE: OFFLINE DEMO MAP';
}
function resize(){
  cv.width=area.clientWidth;cv.height=area.clientHeight;
  lbl.width=cv.width;lbl.height=cv.height;wv.width=wv.clientWidth;wv.height=90;drawLabels();
  if(started){draw();if(!cx){cx=cv.width/2;cy=cv.height/2}}
}

function initAudio(){
  const ac=A.ac=new(window.AudioContext||window.webkitAudioContext)();
  A.master=ac.createGain();A.master.gain.value=0;
  A.pan=ac.createStereoPanner();A.pan.connect(A.master);
  A.an=ac.createAnalyser();A.an.fftSize=256;A.buf=new Uint8Array(A.an.frequencyBinCount);
  const voice=(type,ff,g)=>{
    const o=ac.createOscillator(),f=ac.createBiquadFilter(),gn=ac.createGain();
    o.type=type;f.type='lowpass';f.frequency.value=ff;gn.gain.value=g;
    o.connect(f);f.connect(gn);gn.connect(A.pan);o.start();return{o,f,gn};
  };
  A.mel=voice('sine',1500,.3);A.bass=voice('triangle',500,.5);A.pad=voice('sawtooth',200,.05);
  A.master.connect(A.an);A.an.connect(ac.destination);A.dest=ac.createMediaStreamDestination();A.master.connect(A.dest);
}
function setActive(on){
  if(!A.ac)return;if(A.ac.state==='suspended')A.ac.resume();
  A.master.gain.setTargetAtTime(on?$('vol').value/100*.5:0,A.ac.currentTime,.1);
}
$('vol').oninput=()=>setActive(mode==='auto'||lx.style.display==='block');

function hsl(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return[h,s,l];
}
function sample(x,y){
  let d;try{d=ctx.getImageData(x|0,y|0,1,1).data}catch(e){return}
  const r=d[0],g=d[1],b=d[2],[h,s,l]=hsl(r,g,b),cfg=L[key],t=A.ac.currentTime;
  const lat=90-y/cv.height*180,lon=x/cv.width*360-180,mute=l<.03;
  let mel,bas,flt,cls;
  if(cfg.t==='terrain'){
    mel=notes[Math.min(notes.length-1,h/360*notes.length|0)];bas=40+b/255*80;flt=300+s*2000;
    cls=tr(mute?'nodata':l>.8&&s<.25?'ice':b>r&&b>g?'ocean':g>=r&&g>=b?'land':'desert');
  }else{
    const v=cfg.t==='lum'?Math.min(1,l*2.2):Math.max(0,Math.min(1,1-h/270));
    mel=notes[v*(notes.length-1)|0];bas=40+v*90;flt=300+v*2500;
    cls=mute?tr('nodata'):tr('l_'+key)+': '+tr(['low','mid','high'][v<.34?0:v<.67?1:2]);
  }
  A.mel.o.frequency.setTargetAtTime(mel,t,.05);A.mel.f.frequency.setTargetAtTime(flt,t,.05);
  A.bass.o.frequency.setTargetAtTime(bas,t,.05);
  A.pad.o.frequency.setTargetAtTime(70+(lat+90)/180*70,t,.1);
  A.pan.pan.setTargetAtTime(lon/180,t,.05);
  A.mel.gn.gain.setTargetAtTime(mute?0:.3,t,.05);A.bass.gn.gain.setTargetAtTime(mute?0:.5,t,.05);
  $('v-rgb').textContent=`${r}, ${g}, ${b}`;$('v-pos').textContent=`${lat.toFixed(1)}°, ${lon.toFixed(1)}°`;
  $('v-class').textContent=cls;$('v-mel').textContent=mel.toFixed(1);
  $('v-bass').textContent=bas.toFixed(1);$('v-flt').textContent=flt.toFixed(0);
  cur={c:cls,lat,lon};say(cls,lat,lon);geoReq(lat,lon);
}
function say(c,lat,lon){
  if(!speech||!c||c+curPlace===lastSay||performance.now()-lastT<1200)return;
  lastSay=c+curPlace;lastT=performance.now();speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(`${c}. ${curPlace}. ${tr('lat')} ${lat.toFixed(0)}, ${tr('lon')} ${lon.toFixed(0)}`);u.lang={en:'en-US',ar:'ar-SA',fr:'fr-FR',es:'es-ES'}[lang];speechSynthesis.speak(u);
}
$('speech').onclick=()=>{speech=!speech;if(!speech)speechSynthesis.cancel();toggles()};

const clamp=(v,m)=>Math.max(0,Math.min(m-1,v));
function move(x,y){
  cy=clamp(y,cv.height);ly.style.top=cy+'px';ly.style.display='block';
  if(mode==='auto')return;
  cx=clamp(x,cv.width);lx.style.left=cx+'px';lx.style.display='block';
  setActive(true);sample(cx,cy);
}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
area.addEventListener('pointermove',e=>mode==='manual'&&move(...pos(e)));
area.addEventListener('pointerdown',e=>mode==='manual'&&move(...pos(e)));
area.addEventListener('pointerleave',()=>{if(mode==='manual'){lx.style.display=ly.style.display='none';setActive(false)}});
area.addEventListener('keydown',e=>{
  const s=e.shiftKey?60:12,m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key];
  if(m){e.preventDefault();move(cx+m[0],cy+m[1])}
  else if(e.key===' '){e.preventDefault();setMode(mode==='auto'?'manual':'auto')}
});

function setMode(m){
  mode=m;$('b-manual').classList.toggle('active',m==='manual');$('b-auto').classList.toggle('active',m==='auto');
  if(m==='auto'){lx.style.display='none';scan.style.display='block';ly.style.top=cy+'px';ly.style.display='block';scanX=0;setActive(true)}
  else{scan.style.display=ly.style.display='none';setActive(false)}
}
$('b-manual').onclick=()=>setMode('manual');$('b-auto').onclick=()=>setMode('auto');

function loop(){
  requestAnimationFrame(loop);
  if(mode==='auto'){scanX=(scanX+ +$('speed').value)%cv.width;scan.style.left=scanX+'px';sample(scanX,cy)}
  A.an.getByteFrequencyData(A.buf);
  const w=wv.width,h=wv.height,bw=w/A.buf.length*2.5;let x=0;
  wctx.clearRect(0,0,w,h);
  for(const v of A.buf){
    const bh=v/255*h,gr=wctx.createLinearGradient(0,h,0,h-bh);
    gr.addColorStop(0,'#00f3ff');gr.addColorStop(1,'#ff00ea');
    wctx.fillStyle=gr;wctx.fillRect(x,h-bh,bw,bh);x+=bw+1;
  }
}

$('start-btn').onclick=()=>{
  const s=$('start-screen');s.style.opacity=0;setTimeout(()=>s.style.display='none',800);
  $('app').style.display='grid';
  initAudio();started=true;resize();load('true');loadLabels();
  window.addEventListener('resize',resize);
  area.focus({preventScroll:true});loop();
};

// Record the sonification and download it
$('rec').onclick=()=>{
  if(!A.dest)return;
  if(rec&&rec.state==='recording'){rec.stop();return}
  chunks=[];rec=new MediaRecorder(A.dest.stream);rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));
    a.download='earth-music.'+(rec.mimeType.includes('mp4')?'m4a':'webm');a.click();toggles()};
  rec.start();toggles();
};
// Fly the probe to any searched place
$('sform').onsubmit=async e=>{
  e.preventDefault();const q=$('q').value.trim();if(!q||!started)return;
  try{
    const j=await(await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=${lang}&q=${encodeURIComponent(q)}`)).json();
    if(!j[0])return;if(mode==='auto')setMode('manual');
    move((+j[0].lon+180)/360*cv.width,(90-+j[0].lat)/180*cv.height);
    setTimeout(()=>{if(mode==='manual'&&!area.matches(':hover'))setActive(false)},2500);
  }catch(x){}
};
// Keys 1-5 switch layers
document.addEventListener('keydown',e=>{
  if(!started||/INPUT|SELECT/.test(e.target.tagName))return;
  const k=Object.keys(L)[+e.key-1];if(k)load(k);
});
// Language selectors (browser language by default)
document.querySelectorAll('.langsel').forEach(x=>{
  x.innerHTML='<option value="en">English</option><option value="ar">العربية</option><option value="fr">Français</option><option value="es">Español</option>';
  x.onchange=()=>{lang=x.value;applyLang()};
});
{const nl=navigator.language.slice(0,2);if(T[nl])lang=nl}
buildNotes();applyLang();
</script>
